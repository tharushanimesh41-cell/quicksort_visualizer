<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>QuickSort Visualizer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div style="text-align:center; padding:20px; font-family:sans-serif;">
    <h1>QuickSort Visualizer</h1>
    <input id="inputArray" placeholder="Ex: 3,5,2,1,7,8,4" style="padding:10px;">
    <button onclick="startSort()" style="padding:10px;">Start Sorting</button>

    <!-- Bars tika pennane methanin  -->
    <div id="bars" style="display:flex; justify-content:center; gap:5px; margin-top:20px; height:150px; align-items:flex-end;"></div>
    
    
    <!-- q = pivot index eka -->
    <!-- r = array eke anthima index eka -->
    <div id="logs" style="margin-top:20px; font-family:monospace; text-align:left; background:#eee; padding:10px;"></div>
  </div>
<script src="script.js"></script>
</body>
</html>
